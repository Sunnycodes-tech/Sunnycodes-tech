
name: Update Contribution Cards

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate contribution heatmap
        run: python scripts/generate_heatmap.py

      - name: Generate stats card
        run: python scripts/generate_stats.py

      - name: Commit updated contribution files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update contribution cards"
          git push
