
name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=0D1117&color=8B949E&line=39D353&point=3FB950&area=true&area_color=0D4429&hide_border=true&title_color=3FB950&radius=10&height=400&custom_title=contribution.log
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply terminal theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dist/activity-graph.svg")
          svg = path.read_text(encoding="utf-8")

          # Remove the title above the graph
          svg = re.sub(
              r'<foreignObject\b[^>]*>.*?</foreignObject>',
              '',
              svg,
              flags=re.DOTALL
          )

          # Remove the outer background rectangle border
          svg = re.sub(
              r'(<rect\b[^>]*data-testid="card_bg"[^>]*?)\s+stroke="[^"]*"',
              r'\1 stroke="none"',
              svg,
              count=1
          )

          svg = re.sub(
              r'(<rect\b[^>]*data-testid="card_bg"[^>]*?)\s+style="[^"]*"',
              r'\1 style="stroke:none;stroke-width:0;"',
              svg,
              count=1
          )

          # Keep the title font monospace if any title remains
          svg = svg.replace(
              "font: 600 20px 'Segoe UI', Ubuntu, Sans-Serif;",
              "font: 600 20px monospace;"
          )

          path.write_text(svg, encoding="utf-8")
          PY

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
