name: Update Contribution Activity Graph

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: >-
            bg_color=0D1117&
            color=8B949E&
            title_color=58A6FF&
            line=58A6FF&
            point=79C0FF&
            area=true&
            area_color=0F3D91&
            border_color=30363D&
            hide_border=false&
            radius=10&
            height=400&
            grid=true&
            custom_title=Sunny%20Singh%27s%20Contribution%20Graph
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
